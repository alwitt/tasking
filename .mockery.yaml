all: false
dir: 'mocks/{{.SrcPackageName}}'
filename: '{{.InterfaceName}}_mocks.go'
force-file-write: true
formatter: goimports
log-level: info
structname: '{{.InterfaceName}}'
pkgname: 'mock{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/alwitt/tasking/common:
    config:
      all: true
  github.com/alwitt/tasking/db:
    config:
      all: true
  github.com/alwitt/tasking/models:
    config:
      all: true
  github.com/alwitt/tasking/notify:
    config:
      all: true
  github.com/alwitt/tasking/task:
    config:
      all: true
  github.com/alwitt/tasking/test:
    config:
      all: true
  github.com/alwitt/tasking/workflow:
    config:
      all: true
